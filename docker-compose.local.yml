name: ai-agent-local

services:
  ai-agent-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      TZ: America/Los_Angeles
      AI_AGENT_BACKEND_PORT: 8010
      AI_AGENT_LOCAL_DATA_DIR: /app/local-data
      AI_AGENT_RUNTIME_DIR: /app/backend/runtime
    volumes:
      - ./docker-data/local/local-data:/app/local-data
      - ./docker-data/local/runtime:/app/backend/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6

  ai-agent-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /ai-agent
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_AGENT_LOCAL_PORT:-8080}:80"
    volumes:
      - ./docker/frontend.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ai-agent-backend:
        condition: service_healthy
