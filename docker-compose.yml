name: ai-agent

# The agent publishes no host ports. It joins the external network shared with
# the Lease-Management-System stack; the lease gateway reverse-proxies
# /ai-agent/ and /ai-agent/api/ to these services (after its auth check), and
# the backend reaches the lease MCP endpoint at http://web:5000/mcp.
#
# Create the network once (scripts/update_server.sh does this automatically):
#   docker network create lease-ai-net

services:
  ai-agent-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    expose:
      - "8010"
    environment:
      TZ: Asia/Shanghai
      AI_AGENT_BACKEND_PORT: 8010
      AI_AGENT_LOCAL_DATA_DIR: /app/local-data
      AI_AGENT_RUNTIME_DIR: /app/backend/runtime
      LEASE_MCP_URL: ${LEASE_MCP_URL:-http://web:5000/mcp}
      AI_AGENT_DEFAULT_MODEL: ${AI_AGENT_DEFAULT_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ALIYUN_1875083326719091_API_KEY: ${ALIYUN_1875083326719091_API_KEY:-}
      RENT_MCP_TOKEN: ${RENT_MCP_TOKEN:-}
    volumes:
      - ./docker-data/local-data:/app/local-data
      - ./docker-data/runtime:/app/backend/runtime
    networks:
      - lease-ai-net

  ai-agent-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /ai-agent
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose:
      - "80"
    depends_on:
      - ai-agent-backend
    networks:
      - lease-ai-net

networks:
  lease-ai-net:
    external: true
    name: lease-ai-net
