[project]
name = "ai-agent-backend"
version = "0.1.0"
description = "LangGraph backend for an AI agent learning project."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "httpx",
    "python-dotenv",
    "ddgs",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "seaborn",
    "plotly",
    "beautifulsoup4",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
ai-agent = "agent.cli:main"

[tool.ruff]
exclude = ["runtime"]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
